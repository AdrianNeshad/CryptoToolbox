<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: data:; object-src 'self' blob: data:; media-src 'self' blob: data:; base-uri 'self'; form-action 'self'">
    <meta charset="UTF-8">
    <title>Frame probe</title>
</head>

<body>
    <!--
        Loaded by Toolbox.html in a hidden iframe at startup. If this message reaches the
        parent, tools can be embedded in iframes. If it never arrives (e.g. a browser policy
        blocks local pages in iframes), Toolbox opens tools as separate pages instead.
    -->
    <script>
        if (window.parent !== window) {
            window.parent.postMessage({ source: 'cryptotoolbox', type: 'frame-probe' }, '*');
        }
    </script>
</body>

</html>

name: Build and publish the Windows app

# Runs on every push to main (i.e. every time you push to the repo), plus manually
# via "Run workflow" in the GitHub Actions tab. Changes that only touch .md files
# don't trigger a new build, since they don't affect the built app.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # required to create/update a GitHub Release with the built .exe file

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Caches the downloaded Electron/electron-builder binaries between runs so
      # that not every push has to download Chromium/Electron again.
      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Read version from Toolbox.html
        id: version
        run: npm run sync-version

      - name: Build the Electron app (portable .exe)
        run: |
          npx electron-builder --win portable
          node scripts/finalize-artifacts.js

      # If the release for this version already exists (e.g. multiple pushes without
      # a version bump, or a filename that changed since last time) — empty it of old
      # attached files before we upload the new ones. Otherwise old/renamed files are
      # left alongside the new ones instead of being replaced.
      - name: Clean up old files in the release (if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' |
              while IFS= read -r name; do
                echo "Removing previous asset: $name"
                gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes
              done
          else
            echo "No existing release for $TAG yet — nothing to clean up."
          fi

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CryptoToolbox ${{ steps.version.outputs.version }}
          body: |
            Automatically built from commit ${{ github.sha }}.

            - **CryptoToolbox${{ steps.version.outputs.version }}.exe** — No installation needed, just download and open as usual.
            - **magic.html** — standalone Magic Tool in a single file. Download and open directly in your browser, nothing else required.

          files: |
            release/CryptoToolbox${{ steps.version.outputs.version }}.exe
            tools/Magic/magic.html

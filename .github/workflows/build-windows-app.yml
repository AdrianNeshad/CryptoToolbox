name: Build and publish the Windows app

# Builds only when the pushed commit's message contains [release] (anywhere in the
# message, any letter case, e.g. "3.9 SLIP39 tool release"), or manually via
# "Run workflow" in the GitHub Actions tab. Other pushes show up as "skipped" and
# use no runner. Only the latest commit of a push counts. Changes that only touch
# .md files never trigger a build, since they don't affect the built app.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # required to create/update a GitHub Release with the built .exe file

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'release')
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Caches the downloaded Electron/electron-builder binaries between runs so
      # that not every push has to download Chromium/Electron again.
      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install dependencies
        run: npm ci

      - name: Read version from Toolbox.html
        id: version
        run: npm run sync-version

      - name: Build the Electron app (portable .exe)
        run: |
          npx electron-builder --win portable
          node scripts/finalize-artifacts.js

      # Builds the local browser .zip bundle into release/:
      #   CryptoToolbox<ver>.zip  (plain browser version, no Electron/dev files)
      - name: Build the local browser .zip bundle
        run: node scripts/build-release-zips.js

      # Every [release] push publishes a fresh release of THIS commit, whether or not
      # the version in Toolbox.html changed. The tag and release are still named after
      # that version (v3.8 …), so if a release or tag with that name already exists it
      # is deleted here and recreated below: tag on the new commit, only the new files.
      - name: Remove the existing release and tag for this version (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Replacing the existing release $TAG."
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          else
            echo "No existing release for $TAG."
          fi
          # A tag can also exist without a release
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Deleting the existing tag $TAG."
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || echo "Tag $TAG was already removed."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CryptoToolbox ${{ steps.version.outputs.version }}
          body: |
            Automatically built from commit ${{ github.sha }}.

            - **CryptoToolbox${{ steps.version.outputs.version }}.zip** — Browser version, unzip and open `Toolbox.html`.
            - **CryptoToolbox${{ steps.version.outputs.version }}.exe** — Windows app, just download and open as usual.

          files: |
            release/CryptoToolbox${{ steps.version.outputs.version }}.zip
            release/CryptoToolbox${{ steps.version.outputs.version }}.exe
            tools/Magic/magic.html

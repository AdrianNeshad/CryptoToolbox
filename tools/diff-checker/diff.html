<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Checker</title>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromParent = params.get('theme');
                var saved = localStorage.getItem('theme');
                var theme = (fromParent === 'light' || fromParent === 'dark') ? fromParent
                    : (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                if (fromParent === 'light' || fromParent === 'dark') {
                    localStorage.setItem('theme', fromParent);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <header class="page-header">
            <h1>Diff Checker</h1>
            <p>Compare two texts line by line and see the differences highlighted.</p>
        </header>

        <div class="input-grid">
            <div class="input-col">
                <label class="field-label" for="input-a">Original (A)</label>
                <textarea id="input-a" spellcheck="false" autocomplete="off"
                    placeholder="Paste the first text here"></textarea>
            </div>
            <div class="input-col">
                <label class="field-label" for="input-b">Changed (B)</label>
                <textarea id="input-b" spellcheck="false" autocomplete="off"
                    placeholder="Paste the second text here"></textarea>
            </div>
        </div>

        <div class="options-row">
            <label class="switch-label">
                <input type="checkbox" id="opt-ignore-case" class="switch-input">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                Ignore case
            </label>
            <label class="switch-label">
                <input type="checkbox" id="opt-ignore-whitespace" class="switch-input">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                Ignore whitespace at the start/end of lines
            </label>
            <button id="clear-button" class="secondary" type="button">Clear</button>
        </div>

        <section id="result" class="panel display-none">
            <h2>Result <span id="stats" class="panel-sub"></span></h2>
            <div class="legend">
                <span class="legend-item"><span class="legend-swatch legend-swatch--del"></span>Removed (only in A)</span>
                <span class="legend-item"><span class="legend-swatch legend-swatch--ins"></span>Added (only in B)</span>
            </div>
            <div id="diff-output" class="diff-output"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>

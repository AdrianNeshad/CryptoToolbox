<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob: data:; object-src 'self' blob: data:; media-src 'self' blob: data:; base-uri 'self'; form-action 'self'">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0" id="meta-viewport">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="600">
    <meta property="og:title" content="BIP39 - Mnemonic Checksum Word Calculator">
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromParent = params.get('theme');
                var saved = localStorage.getItem('theme');
                var theme = (fromParent === 'light' || fromParent === 'dark') ? fromParent
                    : (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                if (fromParent === 'light' || fromParent === 'dark') {
                    localStorage.setItem('theme', fromParent);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="./bip39_english.js"></script>
    <script src="./calculator.js"></script>
    <script src="./dom.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <title>BIP-39 - Checksum Word Calculator</title>
</head>

<body>
    <main>

        <h1 style="font-size: 24px;">Checksum finder (BIP-39)</h1>

        <div>
            <div class="seed-type-selector">
                <label for="seedType">Choose Seed Phrase type</label>
                <select id="seedType" onchange="onSeedTypeChange()">
                    <option value="bip39_12">BIP-39 (12 words)</option>
                    <option value="bip39_24">BIP-39 (24 words)</option>
                </select>
            </div>
        </div>

        <div>
            <textarea placeholder="Type 11 words, separated by spaces" oninput="onInput()">
        </textarea>
            <div class="validation display-none"></div>
        </div>
        
        <div class="result display-none">
            <div class="title"></div>
            <div class="list"></div>
        </div>

    </main>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter</title>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromParent = params.get('theme');
                var saved = localStorage.getItem('theme');
                var theme = (fromParent === 'light' || fromParent === 'dark') ? fromParent
                    : (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                if (fromParent === 'light' || fromParent === 'dark') {
                    localStorage.setItem('theme', fromParent);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">

        <header class="page-header">
            <h1>JSON Formatter</h1>
            <p>Format and minify JSON data or decode a JSON Web Token</p>
        </header>

        <div id="json-box">
            <textarea id="json-input" spellcheck="false" placeholder="Paste JSON or a JSON Web Token here..."></textarea>
        </div>

        <div class="button-row">
            <button id="format-button">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M4 6H20M4 12H20M4 18H14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Format
            </button>

            <button id="minify-button">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Minify
            </button>
        </div>

        <div class="button-row">
            <button id="jwt-button">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="8" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" />
                    <path d="M11.2 12H20M17 12V15M20 12V16" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" />
                </svg>
                Decode JWT
            </button>

            <button id="clear-button" class="secondary">
                Clear
            </button>
        </div>

        <div id="status">
            No JSON loaded
        </div>

        <div id="json-result">
            <pre id="output">
                Result appears here
            </pre>
        </div>

        <div class="button-row2">
            <button id="copy-button">
                <svg viewBox="0 0 24 24" fill="none">
                    <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.6" />
                    <path d="M5 15H4C3.4 15 3 14.6 3 14V4C3 3.4 3.4 3 4 3H14C14.6 3 15 3.4 15 4V5" stroke="currentColor"
                        stroke-width="1.6" />
                </svg>
                Copy JSON
            </button>
        </div>

        <div id="toast" class="toast"></div>
        
    </div>

    <script src="script.js"></script>

</body>
</html>

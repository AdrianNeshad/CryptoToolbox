<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BIP39 - Wordlist</title>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromParent = params.get('theme');
                var saved = localStorage.getItem('theme');
                var theme = (fromParent === 'light' || fromParent === 'dark') ? fromParent
                    : (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                if (fromParent === 'light' || fromParent === 'dark') {
                    localStorage.setItem('theme', fromParent);
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <script src="./bip39_english.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main>

        <header class="page-header">
            <h1>BIP39 Wordlist</h1>
            <p>Search and browse all the 2048 words of the BIP39 standard</p>
        </header>

        <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8" />
                <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input type="text" id="search-input" placeholder="Search words..." oninput="onSearchInput()" autocomplete="off">
        </div>

        <div class="controls-bar">
            <select id="language-select" class="language-select" onchange="onLanguageChange()">
                <option value="english" selected>English</option>
                <option value="chinese_simplified">Chinese (Simplified) · 简体中文</option>
                <option value="chinese_traditional">Chinese (Traditional) · 繁體中文</option>
                <option value="czech">Czech · Čeština</option>
                <option value="french">French · Français</option>
                <option value="italian">Italian · Italiano</option>
                <option value="japanese">Japanese · 日本語</option>
                <option value="korean">Korean · 한국어</option>
                <option value="portuguese">Portuguese · Português</option>
                <option value="spanish">Spanish · Español</option>
            </select>
            <div class="result-count" id="result-count"></div>
        </div>

        <div class="word-grid" id="word-grid"></div>

        <div class="empty-state display-none" id="empty-state">
            <p>No words match the search</p>
        </div>

    </main>

    <script src="./script.js"></script>
</body>

</html>
